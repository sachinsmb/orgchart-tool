# Serves the built frontend AND proxies the API same-origin at /api/.
#
# Why: the login screen's Server URL field means "blank = offline mode", where the password is the
# offline prototype gate, not the user's account password. A hosted deployment that does not set the
# API base therefore looks exactly like a wrong password — the page never talks to the server. That
# is what happened on 2026-09-21 when the first colleague tried to sign in.
#
# Same-origin also means one port for users and no CORS, and the page keeps working unchanged
# regardless of how the host is addressed, so this survives any change of access path.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api:8000/;          # trailing slash strips the /api prefix
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
